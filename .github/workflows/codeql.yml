name: CodeQL

# Static analysis for JavaScript/TypeScript via GitHub's CodeQL engine.
# Catches classes of bugs that linters don't (taint tracking, XSS
# sources-to-sinks, prototype pollution, unsafe deserialization, etc.).

# Code scanning requires GitHub Advanced Security on private repos, which this
# repo doesn't have yet, so automatic runs always fail. Manual trigger only
# until the repo goes public — then restore:
#   push/pull_request on [main, v1] and a weekly cron ("0 8 * * 1").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Scoped to this job rather than top-level so the elevated
    # `security-events: write` doesn't leak to any future sibling jobs.
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # `security-extended` adds checks beyond the default pack that
          # have low false-positive rates. Use `security-and-quality` if
          # the team wants style-tier findings too.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
