name: pre-merge

on:
  pull_request:
  push:
    branches: [main, v1]

# Least-privilege default. Jobs that need more should override locally.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Fail the build on any moderate+ vulnerability in runtime deps.
      # Dev-only advisories are reported but not blocking.
      - name: pnpm audit (runtime)
        run: pnpm audit --prod --audit-level=moderate

      - name: pnpm audit (all, informational)
        if: always()
        run: pnpm audit --audit-level=low || true

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # publint validates the published package shape (exports map, types,
      # ESM/CJS duals); the tarball grep ensures nothing beyond the declared
      # surface (dist, package.json, README/LICENSE/NOTICE) ships to npm.
      - name: Package lint (publint + tarball check)
        run: |
          pnpm -C packages/walletconnect exec publint
          pnpm -C packages/walletconnect pack --out /tmp/pkg.tgz
          tar -tzf /tmp/pkg.tgz | grep -v '^package/\(dist/\|package.json\|README.md\|LICENSE\|NOTICE\)' \
            && { echo "Unexpected files in tarball"; exit 1; } || true

      - name: Consumer surface check
        run: pnpm -C packages/walletconnect test:consumer

      - name: Test with coverage
        run: pnpm test:coverage
