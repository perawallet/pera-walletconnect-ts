name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".tool-versions"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/walletconnect/package.json').version")
          [ "v$PKG_VERSION" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package version v$PKG_VERSION"; exit 1; }
      - name: Build and verify
        run: pnpm typecheck && pnpm test && pnpm build && pnpm -C packages/walletconnect exec publint
      - name: Update npm for OIDC support
        run: npm install -g npm@latest && npm --version # OIDC trusted publishing requires npm >= 11.5.1
      # No --provenance: npm only accepts provenance from public source repos.
      # Re-add the flag if/when this repository goes public.
      - name: Publish (OIDC trusted publishing, no token)
        working-directory: packages/walletconnect
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            # npm >= 11.6 requires an explicit --tag for prerelease versions
            # so they don't land on the "latest" dist-tag (1.0.1-beta.0 -> beta)
            PRERELEASE_ID="${VERSION#*-}"
            DIST_TAG="${PRERELEASE_ID%%.*}"
            npm publish --access public --tag "$DIST_TAG"
          else
            npm publish --access public
          fi
